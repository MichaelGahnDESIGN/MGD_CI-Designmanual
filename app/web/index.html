<body>
  <script>
    // Diese Anwendung ist noch kein Offline-Produkt. Ein alter Flutter-Service-
    // Worker darf deshalb keine veraltete Login- oder Sicherheitsoberfläche
    // ausliefern. Neue Releases werden stets direkt vom Server geladen.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.

  -->
  <!-- Die Versionskennung verhindert, dass alte Browser-Caches nach einem
       sicherheitsrelevanten Release eine frühere Flutter-Startdatei nutzen. -->
  <script src="flutter_bootstrap.js?release=20260922-theme-media" async></script>
</body>
