name: mgd_ci_builder
description: Michael Gahn DESIGN CI BUILDER Flutter web application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/font-licenses/
  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Ext-400.woff2
          weight: 400
        - asset: assets/fonts/OpenSans-Ext-600.woff2
          weight: 600
        - asset: assets/fonts/OpenSans-Ext-700.woff2
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Ext-400.woff2
          weight: 400
        - asset: assets/fonts/Lato-Ext-700.woff2
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Ext-400.woff2
          weight: 400
        - asset: assets/fonts/Montserrat-Ext-600.woff2
          weight: 600
        - asset: assets/fonts/Montserrat-Ext-700.woff2
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Ext-400.woff2
          weight: 400
        - asset: assets/fonts/Merriweather-Ext-600.woff2
          weight: 600
        - asset: assets/fonts/Merriweather-Ext-700.woff2
          weight: 700
